# Konfigurasi Nginx untuk SMART-WARGA di VPS Yatindo System Hub
# File: /etc/nginx/sites-available/smartwarga
# Port: 8004 (Bebas konflik dengan SIAKAD SMP 8001, SIAKAD SMK 8002, Manager 8003)

server {
    listen 8004;
    server_name 202.155.13.156;

    # Ganti path ini sesuai direktori clone repo Anda di VPS (misal: /var/www/smartwarga)
    root /var/www/smartwarga/backend/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Menggunakan PHP 8.4-FPM yang sudah aktif di server Ubuntu Anda
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
